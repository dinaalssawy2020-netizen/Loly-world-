<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>عالم لولي 💜</title>
<style>
*{box-sizing:border-box;font-family:system-ui} body{margin:0;background:#fdf4ff;overflow:hidden}
.top{background:linear-gradient(135deg,#c084fc,#a855f7,#ec4899);color:#fff;padding:10px;text-align:center}
.top b{background:rgba(255,255,255,.9);color:#7e22ce;padding:5px 10px;border-radius:15px;margin:0 3px;display:inline-block}
#game{width:100%;height:420px;background:#e9d5ff;position:relative;overflow:hidden;border-bottom:3px solid #a855f7}
.road{position:absolute;bottom:0;left:0;right:0;height:140px;background:#f8fafc;border-top:4px dashed #fff}
.building{position:absolute;top:20px;width:95px;height:150px;border-radius:15px 15px 0 0;text-align:center;padding-top:8px;font-size:22px;color:#fff;font-weight:bold}
#b1{left:10px;background:#ec4899} #b2{left:125px;background:#a855f7} #b3{left:240px;background:#f59e0b}
#girl{position:absolute;width:62px;height:95px;left:160px;top:230px;transition:.1s;text-align:center;z-index:10}
.hair{position:absolute;top:0;left:0;right:0;height:65px;background:#111;border-radius:30px 30px 12px 12px;z-index:1}
.face2{position:absolute;top:18px;left:8px;right:8px;height:45px;background:#ffdbac;border-radius:20px;z-index:2}
.eye{position:absolute;top:18px;font-size:16px} .mouth{position:absolute;top:35px;left:50%;transform:translateX(-50%);font-size:10px}
.body2{position:absolute;bottom:0;left:10px;right:10px;height:38px;background:#a855f7;border-radius:12px;color:#fff;font-size:10px;padding-top:5px;z-index:3}
#msg{background:#fff;margin:10px;border-radius:15px;padding:12px;text-align:center;font-weight:bold;min-height:55px;box-shadow:0 4px 10px #e9d5ff}
.controls{display:flex;justify-content:center;gap:10px;padding:5px}
.controls button{width:60px;height:55px;font-size:24px;border-radius:15px;border:0;background:#fff;box-shadow:0 3px 8px #ddd}
.big{width:100%;padding:13px;border:0;border-radius:14px;background:#a855f7;color:#fff;font-weight:bold;font-size:16px;margin-top:8px}
</style>
</head>
<body>
<div class="top">
<div>💜 عالم لولي 💜</div>
<div style="margin-top:6px"><b>🪙 <span id="coins">100</span></b> <b>❤️ <span id="hearts">5</span></b> <b>👗 <span id="outfit">موف</span></b></div>
</div>

<div id="game">
<div class="building" id="b1">💄<br>محل<br>ميكب</div>
<div class="building" id="b2">👗<br>محل<br>لبس</div>
<div class="building" id="b3">🧋<br>كافيه</div>
<div class="road"></div>
<div id="girl">
<div class="hair"></div>
<div class="face2">
<span class="eye" style="left:6px">👁️</span><span class="eye" style="right:6px">👁️</span>
<div class="mouth">😊</div>
</div>
<div class="body2">💜 لولي</div>
</div>
</div>

<div id="msg">أهلاً يا لولي! امشي بالزراير وروحي لأي محل 💜</div>

<div class="controls">
<button onclick="move(-25)">◀️</button>
<button onclick="move(25)">▶️</button>
<button onclick="enterShop()">🚪 ادخلي</button>
<button onclick="talk()"> كلمي</button>
</div>

<button class="big" onclick="changeLook()">✨ غيري ستايل لولي</button>

<script>
let x=160, coins=100, hearts=5, looks=["💜 فستان موف","🩷 فستان بينك","👑 أميرة","🎀 كيوت"];
let li=0;
function move(dx){x+=dx; if(x<0)x=0; if(x>300)x=300; document.getElementById("girl").style.left=x+"px";
let m=document.getElementById("msg");
if(x<90) m.innerText="انتي قدام محل الميكب 💄 دوسي ادخلي";
else if(x>130 && x<200) m.innerText="انتي قدام محل اللبس 👗 دوسي ادخلي";
else if(x>240) m.innerText="انتي قدام المكتبه 🧋 دوسي ادخلي";
else m.innerText="لولي بتمشي في المدينة... 💜";
}
function enterShop(){
if(x<90){coins+=20; hearts+=1; document.getElementById("msg").innerText="دخلتي محل الميكب! عملتي ميكب موف قمر 💄 +20 🪙";}
else if(x>130 && x<200){coins+=30; document.getElementById("msg").innerText="دخلتي محل اللبس! اشتريتي فستان جديد 👗 +30 🪙"; changeLook();}
else if(x>240){coins+=15; hearts+=2; document.getElementById("msg").innerText="دخلتي المكتبه! قراءتي كتاب  🧋 +15 🪙 +2 ❤️";}
else{document.getElementById("msg").innerText="روحي قدام محل الأول وبعدين دوسي ادخلي 💜";}
document.getElementById("coins").innerText=coins; document.getElementById("hearts").innerText=hearts;
}
function talk(){
let t=["مريم: يا لولي شكلك قمر النهاردة 💜","كوكي: تعالي نروح المكتبه","كوكي: بحب شعرك الأسود الطويل!","مامي برافو يا لولي شاطرة"];
document.getElementById("msg").innerText=t[Math.floor(Math.random()*t.length)]; hearts+=1; document.getElementById("hearts").innerText=hearts;
}
function changeLook(){li=(li+1)%looks.length; document.getElementById("outfit").innerText=looks[li]; document.querySelector(".body2").innerText="💜 لولي - "+looks[li]; document.getElementById("msg").innerText="غيرتي ستايلك لـ "+looks[li]+" ✨ شكلك تحفة!";}
</script>
</body>
</html>
